# Optional: host the frontend on Render instead of Vercel (static site).
services:
  - type: web
    name: hikma-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_TELEGRAM_BOT
        value: hikmafashionbot
